<!-- The ROAM mark: a plain R on a dark rounded square. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#10151c"/>
  <text x="32" y="45" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#edf1f5">R</text>
</svg>
