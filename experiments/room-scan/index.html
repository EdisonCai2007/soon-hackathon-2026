<!doctype html>
<!-- A direct Three.js version of the existing room viewer. The reconstructed
     room fills the viewport; familiar orbit controls and a ceiling cutaway
     let the user inspect the same fused scan from any angle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your room — Gaussian splats</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf1f5;background:#10151c}
*{box-sizing:border-box}body{margin:0;overflow:hidden}#viewport{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}
header{position:fixed;left:28px;top:24px;pointer-events:none;background:#10151c;padding:14px 18px;border-radius:8px;max-width:calc(100vw - 56px)}h1{font-size:25px;line-height:1.2;letter-spacing:-.025em;margin:0 0 7px;font-weight:600}p{margin:0;color:#b7c4d3;font-size:13px;line-height:1.6}
.views{position:fixed;right:28px;top:26px;display:flex;gap:8px}button,.download{font:inherit;font-size:13px;line-height:20px;padding:9px 14px;border:1px solid #465263;background:#1a222d;color:#edf1f5;border-radius:7px;text-decoration:none;cursor:pointer;white-space:nowrap}button:hover,.download:hover{background:#2b3847}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #a6cdfb;outline-offset:4px}
.settings{flex-wrap:wrap;position:fixed;bottom:25px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:#171f29;border:1px solid #374252;padding:16px 20px;border-radius:10px}
.control{display:flex;align-items:center;gap:12px;font-size:13px;white-space:nowrap}.control label{display:flex;align-items:center;gap:8px}.sliders{display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{font:inherit;color:#edf1f5;background:#202c3b;border:1px solid #465263;border-radius:5px;padding:5px 8px;max-width:155px}select:focus-visible{outline:2px solid #a6cdfb;outline-offset:3px}input[type=range]{width:130px;accent-color:#adcff5;cursor:pointer}input[type=checkbox]{accent-color:#adcff5;width:16px;height:16px;cursor:pointer}input:disabled{opacity:.4;cursor:default}
#status{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:#171f29;padding:18px 24px;border:1px solid #465263;border-radius:10px;max-width:90vw;text-align:center;font-size:14px;line-height:1.6}
.hint{position:fixed;left:28px;bottom:112px;pointer-events:none;color:#adbbcb;font-size:12px;background:#10151c;padding:6px 10px;border-radius:4px}.key{color:#d8e3f0}#facts{font-variant-numeric:tabular-nums}
@media(max-width:750px){header{left:18px;top:20px}.views{right:18px;top:90px}h1{font-size:23px}.settings{left:12px;right:12px;bottom:12px;padding:14px;flex-wrap:wrap;gap:12px}.sliders{flex-wrap:wrap;gap:12px 20px}.control{gap:8px}input[type=range]{width:100px}.hint{left:18px;bottom:160px;font-size:11px}.download{padding:6px 10px}}
@media(max-width:600px){header{left:12px;right:12px;top:12px;max-width:none;padding:12px}h1{font-size:21px}header p{font-size:12px}.views{top:132px;left:12px;right:12px;justify-content:flex-end}.sliders{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:12px}.control{flex-direction:column;align-items:flex-start;gap:5px}.control select{width:100%;max-width:100%}input[type=range]{width:100%}.hint{left:12px;bottom:225px;font-size:10px}.settings{gap:10px}.download{font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<main id="viewport" aria-label="Interactive Gaussian-splat reconstruction of your room"></main>
<header><h1>Your room, reconstructed.</h1><p id="facts">Loading the fitted Gaussian splats…</p><p>Fitted to your video · unseen surfaces may be incomplete</p></header>
<nav class="views" aria-label="Camera views"><button id="reset">Room view</button><button id="overview">Overview</button><button id="top">Top view</button></nav>
<p class="hint">Click the scene · <span class="key">W/A/S/D</span> move · <span class="key">Q/E</span> down/up · <span class="key">Drag</span> to look · <span class="key">Shift</span> faster · Scroll forward/back</p>
<section class="settings" aria-label="Scan display settings">
 <div class="sliders">
  <div class="control"><label for="ceiling"><input id="ceiling" type="checkbox">Hide ceiling</label></div>
  <div class="control"><label for="height">Cutaway height</label><input id="height" type="range" min="10" max="100" step="1" value="73"></div>
  <div class="control"><label for="mode">Render</label><select id="mode"><option value="splats">Gaussian splats</option><option value="points">Original points</option></select></div>
<div class="control"><label for="view">Camera</label><select id="view" aria-label="Source video camera"></select></div>
 </div>
 <a class="download" href="room_splats.ply" download="room_splats.ply">Download 3D scan ↓</a>
</section>
<div id="status" role="status" aria-live="polite">Loading your room…</div>
<script type="module" src="./splat-viewer.js"></script>
</body>
</html>
